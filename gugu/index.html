<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" sizes="128x128" href="https://raw.githubusercontent.com/TawandaAfeki/CC/main/fav.webp"/>
<title>Happy 1 Month ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --deep-rose: #9e1b34;
  --blush: #e8a0b4;
  --ivory: #fdf6ee;
  --parchment: #faf0e4;
  --ink: #2c1810;
  --envelope-body: #d4a574;
  --envelope-dark: #b8895a;
  --envelope-inner: #e8c9a0;
}

html, body {
  width: 100%;
  min-height: 100dvh;
  overflow-x: hidden;
  font-family: 'Lora', Georgia, serif;
  background: #1a0a0a;
}

/* ─── COLLAGE BACKGROUND ─── */
.collage-bg {
  position: fixed; inset: 0 3% 0 3%; z-index: 0;
  opacity: 0; transition: opacity 1.8s ease; overflow: hidden;
}
.collage-bg.visible { opacity: 1; }
.collage-slot {
  position: absolute;
  border: 3px solid rgba(255,255,255,0.15);
  border-radius: 4px; overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.collage-slot img {
  width: 100%; height: 100%; object-fit: cover;
  filter: brightness(0.75) saturate(0.85);
}
.collage-slot:nth-child(1) { top:-5%;  left:-5%;  width:55%; height:35%; transform:rotate(-4deg); }
.collage-slot:nth-child(2) { top:5%;   left:40%;  width:50%; height:30%; transform:rotate(3deg); }
.collage-slot:nth-child(3) { top:25%;  left:-8%;  width:45%; height:32%; transform:rotate(2deg); }
.collage-slot:nth-child(4) { top:30%;  left:35%;  width:55%; height:28%; transform:rotate(-3deg); }
.collage-slot:nth-child(5) { top:50%;  left:-3%;  width:50%; height:30%; transform:rotate(-2deg); }
.collage-slot:nth-child(6) { top:55%;  left:42%;  width:52%; height:32%; transform:rotate(4deg); }
.collage-slot:nth-child(7) { top:72%;  left:-6%;  width:48%; height:34%; transform:rotate(3deg); }
.collage-slot:nth-child(8) { top:78%;  left:38%;  width:55%; height:28%; transform:rotate(-4deg); }

.collage-overlay {
  position: fixed; inset: 0; z-index: 1;
  background: radial-gradient(ellipse at center, rgba(30,5,10,0.4) 0%, rgba(15,2,5,0.75) 100%);
  pointer-events: none;
}
.vignette {
  position: fixed; inset: 0; z-index: 2;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(10,2,2,0.7) 100%);
  pointer-events: none;
}

/* ─── MAIN STAGE ─── */
.stage {
  position: relative; z-index: 10;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 100dvh;
  padding: 20px 20px 100px;
}

/* ─── PROMPT TEXT ─── */
.tap-prompt {
  font-family: 'Dancing Script', cursive;
  color: var(--blush);
  font-size: clamp(1.1rem, 4vw, 1.5rem);
  margin-bottom: 18px;
  opacity: 0;
  animation: fadeInPrompt 1.2s 0.6s ease forwards;
  text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  letter-spacing: 0.5px;
}
@keyframes fadeInPrompt { to { opacity: 1; } }
.tap-prompt.hidden { display: none; }

/* ─── ASSEMBLY: letter + envelope stacked vertically ─── */
.mail-assembly {
  position: relative;
  width: clamp(240px, 70vw, 340px);  /* was clamp(280px, 85vw, 380px) */
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  animation: envelopeEntry 0.8s ease-out both;
}
@keyframes envelopeEntry {
  from { opacity: 0; transform: translateY(40px) scale(0.9); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.mail-assembly.opened { cursor: default; }

/* ─── LETTER ─── 
   Sits above the envelope in DOM flow.
   Starts collapsed (max-height:0 + overflow:hidden) so it's invisible.
   On open, expands to its natural content height and becomes sticky. */
.letter {
  position: relative;
  z-index: 20;
  width: 88%;
  margin: 0 auto;
  background: var(--parchment);
  border-radius: 5px 5px 0 0;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.25), 0 2px 16px rgba(0,0,0,0.15);
  padding: 0;
  text-align: center;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s,
              opacity 0.6s ease 0.4s,
              padding 0.8s ease 0.35s;
}

.opened .letter {
  max-height: 600px;
  opacity: 1;
  padding: 20px 18px 16px;  /* was 28px 22px 20px */
  position: sticky;
  top: 12px;
}

.letter h2 {
  font-family: 'Dancing Script', cursive;
  font-weight: 700;
  color: var(--deep-rose);
  font-size: clamp(1.1rem, 4.5vw, 1.6rem);  /* was clamp(1.3rem, 5vw, 1.8rem) */
  margin-bottom: 10px;  /* was 14px */
  line-height: 1.25;
}
.letter p {
  color: var(--ink);
  font-size: clamp(0.75rem, 2.6vw, 0.92rem);  /* was clamp(0.82rem, 3vw, 1rem) */
  line-height: 1.6;  /* was 1.7 */
  font-style: italic;
  margin-bottom: 4px;
}
.letter .signature {
  margin-top: 10px;
  font-family: 'Dancing Script', cursive;
  font-weight: 500;
  color: var(--deep-rose);
  font-size: clamp(1rem, 3.5vw, 1.2rem);
  font-style: normal;
}

/* ─── ENVELOPE ─── */
.envelope {
  position: relative;
  width: 100%;
  aspect-ratio: 1.7 / 1;  /* was 1.5 / 1 — wider = shorter */
  perspective: 800px;
}

.envelope-body {
  position: absolute; inset: 0;
  z-index: 4;
  border-radius: 6px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  overflow: hidden;
}
.envelope-body::after { display: none; }

.envelope-shape {
  width: 100%;
  height: 100%;
  display: block;
}

.envelope-flap {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 55%;
  z-index: 6;
  transform-origin: top center;
  transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.envelope-flap svg {
  width: 100%; height: 100%;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
}
.opened .envelope-flap {
  transform: rotateX(180deg);
  z-index: 1;
}

.seal {
  position: absolute;
  top: 38%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 7; font-size: 28px;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
  transition: opacity 0.3s;
}
.opened .seal { opacity: 0; }

/* ─── FLOATING HEARTS ─── */
.heart {
  position: fixed; z-index: 15;
  pointer-events: none;
  will-change: transform, top;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
}
.heart svg { width: 100%; height: 100%; }

@keyframes ceilingDrift {
  0%, 100% { transform: translateX(0) rotate(var(--rot)); }
  33%  { transform: translateX(calc(var(--drift) * 1px)) rotate(calc(var(--rot) + 4deg)); }
  66%  { transform: translateX(calc(var(--drift) * -0.6px)) rotate(calc(var(--rot) - 3deg)); }
}

/* ─── RESET BUTTON ─── */
.reset-btn {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  background: rgba(158, 27, 52, 0.85);
  color: var(--ivory);
  border: 1px solid rgba(255,255,255,0.15);
  padding: 12px 28px; border-radius: 40px;
  font-family: 'Lora', serif; font-size: 0.9rem;
  letter-spacing: 1px; cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  opacity: 0; pointer-events: none;
  transition: opacity 0.6s ease, background 0.3s ease;
}
.reset-btn.visible { opacity: 1; pointer-events: auto; }
.reset-btn:active {
  background: rgba(158, 27, 52, 1);
  transform: translateX(-50%) scale(0.96);
}


</style>
</head>
<body>

<!-- Background Photo Collage -->
<div class="collage-bg" id="collageBg">
  <div class="collage-slot"><img src="https://ahdctxgdszwncyuvwbtp.supabase.co/storage/v1/object/public/posters/G/IMG_5486.jpeg" alt=""></div>
  <div class="collage-slot"><img src="https://ahdctxgdszwncyuvwbtp.supabase.co/storage/v1/object/public/posters/G/IMG_5415.jpeg" alt=""></div>
  <div class="collage-slot"><img src="https://ahdctxgdszwncyuvwbtp.supabase.co/storage/v1/object/public/posters/G/CA2F307B-DCB1-470E-821E-FB02160D51C0.jpeg" alt=""></div>
  <div class="collage-slot"><img src="https://ahdctxgdszwncyuvwbtp.supabase.co/storage/v1/object/public/posters/G/FullSizeRender.jpeg" alt=""></div>
  <div class="collage-slot"><img src="https://ahdctxgdszwncyuvwbtp.supabase.co/storage/v1/object/public/posters/G/IMG_5538.jpeg" alt=""></div>
  <div class="collage-slot"><img src="https://ahdctxgdszwncyuvwbtp.supabase.co/storage/v1/object/public/posters/G/7e27029f-064c-4d91-ad2b-6ca83f176364.jpeg" alt=""></div>
  <div class="collage-slot"><img src="https://ahdctxgdszwncyuvwbtp.supabase.co/storage/v1/object/public/posters/G/IMG_5522.jpeg" alt=""></div>
  <div class="collage-slot"><img src="https://ahdctxgdszwncyuvwbtp.supabase.co/storage/v1/object/public/posters/G/98c63026-ce71-4bf2-89f4-3641e516fe10%20(2).jpeg" alt=""></div>
</div>
<div class="collage-overlay"></div>
<div class="vignette"></div>

<!-- Main Stage -->
<div class="stage" id="stage">
  <p class="tap-prompt" id="tapPrompt">Tap the envelope...</p>

  <div class="mail-assembly" id="mailAssembly">
    <!-- LETTER — sits above envelope in DOM, starts collapsed -->
    <div class="letter" id="letter">
      <!--
        ═══════════════════════════════════
        PERSONALISE YOUR LETTER TEXT BELOW
        The letter auto-sizes to fit your text.
        ═══════════════════════════════════
      -->
      <h2>Happy 1 Month<br>My Love 💕</h2>
      <p>
        Every moment with you feels like a beautiful dream
        I never want to wake up from. You've made this the most magical chapter of my life.</br> 
        Here's to forever.
      </p>
      <p class="signature">Forever yours ❤️</p>
    </div>

    <!-- ENVELOPE — always visible -->
<div class="envelope">
  <!-- Top flap -->
  <div class="envelope-flap">
    <svg viewBox="0 0 400 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="flapGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#c49660"/>
          <stop offset="100%" stop-color="#b8895a"/>
        </linearGradient>
      </defs>
      <polygon points="0,0 400,0 200,210" fill="url(#flapGrad)" stroke="#a67d4a" stroke-width="0.5"/>
    </svg>
  </div>
  <div class="seal">❤️</div>

  <!-- Envelope body with side flaps -->
  <div class="envelope-body">
    <svg class="envelope-shape" viewBox="0 0 400 267" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d4a574"/>
          <stop offset="100%" stop-color="#b8895a"/>
        </linearGradient>
        <linearGradient id="leftFlap" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#c49660"/>
          <stop offset="100%" stop-color="#d4a574"/>
        </linearGradient>
        <linearGradient id="rightFlap" x1="1" y1="0" x2="0" y2="0">
          <stop offset="0%" stop-color="#c49660"/>
          <stop offset="100%" stop-color="#d4a574"/>
        </linearGradient>
      </defs>
      <!-- Main body -->
      <rect x="0" y="0" width="400" height="267" rx="6" fill="url(#bodyGrad)"/>
      <!-- Left side flap -->
      <polygon points="0,0 0,267 160,133" fill="url(#leftFlap)" opacity="0.35"/>
      <!-- Right side flap -->
      <polygon points="400,0 400,267 240,133" fill="url(#rightFlap)" opacity="0.35"/>
      <!-- Bottom flap fold line -->
      <polygon points="0,267 400,267 200,160" fill="#c8995c" opacity="0.2"/>
      <!-- Subtle inner shadow at top -->
      <rect x="0" y="0" width="400" height="60" fill="url(#bodyGrad)" opacity="0.15" rx="6"/>
    </svg>
  </div>
</div>
  </div> <!-- close mail-assembly -->
</div> <!-- close stage -->

<button class="reset-btn" id="resetBtn">Experience Again ♡</button>
<!-- YouTube API player container — hidden off-screen, 2x2 minimum for API to work -->
<div id="ytPlayerWrap" style="position:fixed;bottom:0;left:0;width:120px;height:80px;opacity:0.001;pointer-events:none;z-index:-1;">
  <div id="ytPlayer"></div>
</div>
<audio id="bgMusic" loop preload="auto">
  <source src="https://ahdctxgdszwncyuvwbtp.supabase.co/storage/v1/object/public/posters/G/for-king--country.mp3" type="audio/mpeg">
</audio>
<script>
(() => {
  const HEART_COUNT = 100;
  const FLOAT_DURATION_MS = 1800;

  const assembly = document.getElementById('mailAssembly');
  const tapPrompt = document.getElementById('tapPrompt');
  const resetBtn  = document.getElementById('resetBtn');
  const collageBg = document.getElementById('collageBg');
  const bgMusic   = document.getElementById('bgMusic');

  let isOpen = false;
  let hearts = [];

  function playAudio() {
    bgMusic.volume = 0.8;
    bgMusic.currentTime = 0;
    bgMusic.play().catch(e => console.log('Play failed:', e));
  }

  function stopAudio() {
    bgMusic.pause();
    bgMusic.currentTime = 0;
  }

  function heartSVG(color) {
    return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
               2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09
               C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5
               c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
            fill="${color}"/>
    </svg>`;
  }

  const heartColors = [
    '#c0392b','#e74c3c','#d63031','#e84393',
    '#fd79a8','#b71540','#e55039','#ff6b81',
    '#f78fb3','#cf1d43','#a4243b','#d72631'
  ];

  function spawnHearts() {
    const rect = assembly.getBoundingClientRect();
    const originX = rect.left + rect.width / 2;
    const originY = rect.top;
    for (let i = 0; i < HEART_COUNT; i++) {
      setTimeout(() => createHeart(originX, originY), i * 55);
    }
  }

  function createHeart(ox, oy) {
    const el = document.createElement('div');
    el.className = 'heart';
    const size = 18 + Math.random() * 28;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    const color = heartColors[Math.floor(Math.random() * heartColors.length)];
    el.innerHTML = heartSVG(color);
    el.style.left = (ox + (Math.random() - 0.5) * 180 - size / 2) + 'px';
    el.style.top  = (oy + (Math.random() - 0.5) * 50 - size / 2) + 'px';
    el.style.opacity = '0';
    document.body.appendChild(el);
    hearts.push(el);

    const ceilingY = 6 + Math.random() * 45;
    const finalX   = Math.random() * (window.innerWidth - size);
    const rotation = (Math.random() - 0.5) * 40;
    const drift    = (Math.random() - 0.5) * 20;

    requestAnimationFrame(() => {
      el.style.opacity = '1';
      el.style.transition = `top ${FLOAT_DURATION_MS}ms cubic-bezier(0.22,1,0.36,1),
                             left ${FLOAT_DURATION_MS}ms cubic-bezier(0.22,1,0.36,1),
                             opacity 0.3s ease`;
      el.style.transform = `rotate(${rotation}deg)`;
      requestAnimationFrame(() => {
        el.style.top  = ceilingY + 'px';
        el.style.left = finalX + 'px';
      });
    });

    setTimeout(() => {
      el.style.transition = 'none';
      el.style.setProperty('--rot', rotation + 'deg');
      el.style.setProperty('--drift', String(drift));
      el.style.animation = `ceilingDrift ${3 + Math.random() * 4}s ease-in-out infinite`;
    }, FLOAT_DURATION_MS + 100);
  }

  function clearHearts() {
    hearts.forEach(h => {
      h.style.transition = 'opacity 0.5s ease';
      h.style.opacity = '0';
      setTimeout(() => h.remove(), 600);
    });
    hearts = [];
  }

  function openEnvelope() {
    if (isOpen) return;
    isOpen = true;
    assembly.classList.add('opened');
    tapPrompt.classList.add('hidden');
    setTimeout(() => collageBg.classList.add('visible'), 400);
    setTimeout(spawnHearts, 500);
    setTimeout(() => resetBtn.classList.add('visible'), 2800);
    playAudio();
  }

  function resetExperience() {
    isOpen = false;
    resetBtn.classList.remove('visible');
    clearHearts();
    assembly.classList.remove('opened');
    collageBg.classList.remove('visible');
    stopAudio();
    setTimeout(() => {
      tapPrompt.classList.remove('hidden');
      tapPrompt.style.animation = 'none';
      tapPrompt.offsetHeight;
      tapPrompt.style.animation = 'fadeInPrompt 1.2s 0.3s ease forwards';
      tapPrompt.style.opacity = '0';
    }, 600);
  }

    let resetCooldown = false;

  assembly.addEventListener('click', function() {
    if (resetCooldown) return;
    openEnvelope();
  });

  resetBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    e.preventDefault();
    resetExperience();
    resetCooldown = true;
    setTimeout(() => { resetCooldown = false; }, 800);
  });
})();
</script>
</body>
</html>

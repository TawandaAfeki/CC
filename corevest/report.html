<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corevest | Report Viewer</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/TawandaAfeki/CC/main/fav.webp"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  iframe{width:100%;height:100%;border:none;display:block}
</style>
</head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const file = params.get('file');
  if (file) {
    document.querySelector('iframe') || document.body.appendChild(Object.assign(document.createElement('iframe'), {src: file}));
  }
</script>
<iframe id="viewer"></iframe>
<script>
  document.getElementById('viewer').src = new URLSearchParams(window.location.search).get('file') || '';
</script>
</body>
</html>
